naftiko: 1.0.0-alpha2
info:
  label: Microsoft Outlook Email Productivity
  description: Unified capability for Microsoft Outlook email productivity combining mail operations, folder management, and
    attachment handling via Microsoft Graph. Used by productivity teams, IT administrators, and automation engineers.
  tags:
  - Microsoft
  - Outlook
  - Email
  - Productivity
  - Graph API
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    MICROSOFT_GRAPH_TOKEN: MICROSOFT_GRAPH_TOKEN
capability:
  consumes:
  - type: http
    namespace: graph-mail
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Mail API for Outlook email operations
    authentication:
      type: bearer
      token: '{{MICROSOFT_GRAPH_TOKEN}}'
    resources:
    - name: messages
      path: /me/messages
      description: Email message operations
      operations:
      - name: list-messages
        method: GET
        description: List messages in the signed-in user's mailbox
        inputParameters:
        - name: $top
          in: query
          type: integer
          required: false
          description: Number of messages to return
        - name: $skip
          in: query
          type: integer
          required: false
          description: Number of messages to skip
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter expression
        - name: $select
          in: query
          type: string
          required: false
          description: Comma-separated properties to select
        - name: $search
          in: query
          type: string
          required: false
          description: Search expression
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-draft-message
        method: POST
        description: Create a draft message
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            subject: '{{tools.subject}}'
            body: '{{tools.body}}'
            toRecipients: '{{tools.to_recipients}}'
      - name: get-message
        method: GET
        description: Get a specific message by ID
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-message
        method: PATCH
        description: Update a message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-message
        method: DELETE
        description: Delete a message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: send-draft-message
        method: POST
        description: Send a draft message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Draft message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: send-mail
        method: POST
        description: Send a new email message
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            message: '{{tools.message}}'
      - name: copy-message
        method: POST
        description: Copy a message to a folder
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            destinationId: '{{tools.destination_id}}'
      - name: move-message
        method: POST
        description: Move a message to a folder
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            destinationId: '{{tools.destination_id}}'
      - name: reply-to-message
        method: POST
        description: Reply to a message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            comment: '{{tools.comment}}'
      - name: reply-all-to-message
        method: POST
        description: Reply all to a message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            comment: '{{tools.comment}}'
      - name: forward-message
        method: POST
        description: Forward a message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            comment: '{{tools.comment}}'
            toRecipients: '{{tools.to_recipients}}'
    - name: mail-folders
      path: /me/mailFolders
      description: Mail folder operations
      operations:
      - name: list-mail-folders
        method: GET
        description: List mail folders
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-mail-folder
        method: POST
        description: Create a mail folder
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            displayName: '{{tools.display_name}}'
      - name: get-mail-folder
        method: GET
        description: Get a specific mail folder
        inputParameters:
        - name: mailFolder-id
          in: path
          type: string
          required: true
          description: Mail folder ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-mail-folder
        method: PATCH
        description: Update a mail folder
        inputParameters:
        - name: mailFolder-id
          in: path
          type: string
          required: true
          description: Mail folder ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-mail-folder
        method: DELETE
        description: Delete a mail folder
        inputParameters:
        - name: mailFolder-id
          in: path
          type: string
          required: true
          description: Mail folder ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-messages-in-folder
        method: GET
        description: List messages in a specific mail folder
        inputParameters:
        - name: mailFolder-id
          in: path
          type: string
          required: true
          description: Mail folder ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: attachments
      path: /me/messages
      description: Message attachment operations
      operations:
      - name: list-attachments
        method: GET
        description: List attachments for a message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: add-attachment
        method: POST
        description: Add an attachment to a message
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-attachment
        method: GET
        description: Get a specific attachment
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        - name: attachment-id
          in: path
          type: string
          required: true
          description: Attachment ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-attachment
        method: DELETE
        description: Delete an attachment
        inputParameters:
        - name: message-id
          in: path
          type: string
          required: true
          description: Message ID
        - name: attachment-id
          in: path
          type: string
          required: true
          description: Attachment ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: email-productivity-api
    description: Unified REST API for Microsoft Outlook email productivity.
    resources:
    - path: /v1/messages
      name: messages
      description: Email messages
      operations:
      - method: GET
        name: list-messages
        description: List email messages
        call: graph-mail.list-messages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-draft
        description: Create a draft message
        call: graph-mail.create-draft-message
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{id}
      name: message
      description: Single email message
      operations:
      - method: GET
        name: get-message
        description: Get a specific message
        call: graph-mail.get-message
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: update-message
        description: Update a message
        call: graph-mail.update-message
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-message
        description: Delete a message
        call: graph-mail.delete-message
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{id}/send
      name: send-draft
      description: Send a draft message
      operations:
      - method: POST
        name: send-draft
        description: Send a draft message
        call: graph-mail.send-draft-message
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{id}/reply
      name: reply
      description: Reply to a message
      operations:
      - method: POST
        name: reply
        description: Reply to a message
        call: graph-mail.reply-to-message
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{id}/forward
      name: forward
      description: Forward a message
      operations:
      - method: POST
        name: forward
        description: Forward a message
        call: graph-mail.forward-message
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{id}/attachments
      name: attachments
      description: Message attachments
      operations:
      - method: GET
        name: list-attachments
        description: List attachments
        call: graph-mail.list-attachments
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: add-attachment
        description: Add an attachment
        call: graph-mail.add-attachment
        with:
          message-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/send-mail
      name: send-mail
      description: Send a new email directly
      operations:
      - method: POST
        name: send-mail
        description: Send a new email message
        call: graph-mail.send-mail
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/folders
      name: folders
      description: Mail folders
      operations:
      - method: GET
        name: list-folders
        description: List mail folders
        call: graph-mail.list-mail-folders
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-folder
        description: Create a mail folder
        call: graph-mail.create-mail-folder
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/folders/{id}
      name: folder
      description: Single mail folder
      operations:
      - method: GET
        name: get-folder
        description: Get a mail folder
        call: graph-mail.get-mail-folder
        with:
          mailFolder-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: update-folder
        description: Update a mail folder
        call: graph-mail.update-mail-folder
        with:
          mailFolder-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-folder
        description: Delete a mail folder
        call: graph-mail.delete-mail-folder
        with:
          mailFolder-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/folders/{id}/messages
      name: folder-messages
      description: Messages in a folder
      operations:
      - method: GET
        name: list-folder-messages
        description: List messages in a folder
        call: graph-mail.list-messages-in-folder
        with:
          mailFolder-id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: email-productivity-mcp
    transport: http
    description: MCP server for AI-assisted Microsoft Outlook email productivity.
    tools:
    - name: list-messages
      description: List email messages in the Outlook mailbox
      hints:
        readOnly: true
        openWorld: true
      call: graph-mail.list-messages
      outputParameters:
      - type: object
        mapping: $.
    - name: get-message
      description: Get a specific email message by ID
      hints:
        readOnly: true
      call: graph-mail.get-message
      with:
        message-id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
    - name: send-mail
      description: Send a new email message directly
      hints:
        readOnly: false
      call: graph-mail.send-mail
      with:
        message: tools.message
      outputParameters:
      - type: object
        mapping: $.
    - name: create-draft
      description: Create a draft email message
      hints:
        readOnly: false
      call: graph-mail.create-draft-message
      with:
        subject: tools.subject
        body: tools.body
        to_recipients: tools.to_recipients
      outputParameters:
      - type: object
        mapping: $.
    - name: send-draft
      description: Send an existing draft message
      hints:
        readOnly: false
      call: graph-mail.send-draft-message
      with:
        message-id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-message
      description: Update an email message
      hints:
        readOnly: false
        idempotent: true
      call: graph-mail.update-message
      with:
        message-id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-message
      description: Delete an email message
      hints:
        readOnly: false
        destructive: true
      call: graph-mail.delete-message
      with:
        message-id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
    - name: reply-to-message
      description: Reply to an email message
      hints:
        readOnly: false
      call: graph-mail.reply-to-message
      with:
        message-id: tools.message_id
        comment: tools.comment
      outputParameters:
      - type: object
        mapping: $.
    - name: reply-all-to-message
      description: Reply all to an email message
      hints:
        readOnly: false
      call: graph-mail.reply-all-to-message
      with:
        message-id: tools.message_id
        comment: tools.comment
      outputParameters:
      - type: object
        mapping: $.
    - name: forward-message
      description: Forward an email message to recipients
      hints:
        readOnly: false
      call: graph-mail.forward-message
      with:
        message-id: tools.message_id
        comment: tools.comment
        to_recipients: tools.to_recipients
      outputParameters:
      - type: object
        mapping: $.
    - name: copy-message
      description: Copy a message to a different folder
      hints:
        readOnly: false
      call: graph-mail.copy-message
      with:
        message-id: tools.message_id
        destination_id: tools.destination_id
      outputParameters:
      - type: object
        mapping: $.
    - name: move-message
      description: Move a message to a different folder
      hints:
        readOnly: false
      call: graph-mail.move-message
      with:
        message-id: tools.message_id
        destination_id: tools.destination_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-folders
      description: List mail folders in the mailbox
      hints:
        readOnly: true
        openWorld: true
      call: graph-mail.list-mail-folders
      outputParameters:
      - type: object
        mapping: $.
    - name: create-folder
      description: Create a new mail folder
      hints:
        readOnly: false
      call: graph-mail.create-mail-folder
      with:
        display_name: tools.display_name
      outputParameters:
      - type: object
        mapping: $.
    - name: get-folder
      description: Get a specific mail folder
      hints:
        readOnly: true
      call: graph-mail.get-mail-folder
      with:
        mailFolder-id: tools.folder_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-folder
      description: Delete a mail folder
      hints:
        readOnly: false
        destructive: true
      call: graph-mail.delete-mail-folder
      with:
        mailFolder-id: tools.folder_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-folder-messages
      description: List messages in a specific mail folder
      hints:
        readOnly: true
        openWorld: true
      call: graph-mail.list-messages-in-folder
      with:
        mailFolder-id: tools.folder_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-attachments
      description: List attachments for a message
      hints:
        readOnly: true
      call: graph-mail.list-attachments
      with:
        message-id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-attachment
      description: Get a specific attachment from a message
      hints:
        readOnly: true
      call: graph-mail.get-attachment
      with:
        message-id: tools.message_id
        attachment-id: tools.attachment_id
      outputParameters:
      - type: object
        mapping: $.
    - name: add-attachment
      description: Add an attachment to a message
      hints:
        readOnly: false
      call: graph-mail.add-attachment
      with:
        message-id: tools.message_id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-attachment
      description: Delete an attachment from a message
      hints:
        readOnly: false
        destructive: true
      call: graph-mail.delete-attachment
      with:
        message-id: tools.message_id
        attachment-id: tools.attachment_id
      outputParameters:
      - type: object
        mapping: $.
