      properties:
        name:
          type: string
          description: The name of the message header.
          example: Example Title
        value:
          type: string
          description: The value of the message header.
          example: example_value
    MailFolder:
      type: object
      description: A mail folder in a user's mailbox, such as Inbox and Drafts. Mail folders can contain messages, other Outlook items, and child mail folders.
      properties:
        id:
          type: string
          description: The unique identifier of the mail folder. Read-only.
          readOnly: true
          example: abc123
        displayName:
          type: string
          description: The mail folder's display name.
          example: example_value
        parentFolderId:
          type: string
          description: The unique identifier for the parent mail folder.
          example: '500123'
        childFolderCount:
          type: integer
          format: int32
          description: The number of immediate child mail folders in the current folder.
          example: 10
        unreadItemCount:
          type: integer
          format: int32
          description: The number of items marked as unread in the folder.
          example: 10
        totalItemCount:
          type: integer
          format: int32
          description: The number of items in the folder.
          example: 10
        isHidden:
          type: boolean
          description: Indicates whether the mail folder is hidden. Can only be set when creating the folder.
          example: true
    ItemBody:
      type: object
      description: Represents the body content of a message.
      properties:
        contentType:
          type: string
          enum:
          - text
          - html
          description: The type of the content. Possible values are text and html.
          example: text
        content:
          type: string
          description: The content of the item body.
          example: example_value
  parameters:
    select:
      name: $select
      in: query
