    EmailAddress:
      type: object
      description: Represents an email address entity.
      properties:
        name:
          type: string
          description: The display name of the person or entity.
          example: Example Title
        address:
          type: string
          format: email
          description: The email address of the person or entity.
          example: example_value
    FollowupFlag:
      type: object
      description: Represents the follow-up flag status on a message.
      properties:
        completedDateTime:
          $ref: '#/components/schemas/DateTimeTimeZone'
        dueDateTime:
          $ref: '#/components/schemas/DateTimeTimeZone'
        startDateTime:
          $ref: '#/components/schemas/DateTimeTimeZone'
        flagStatus:
          type: string
          enum:
          - notFlagged
          - complete
          - flagged
          description: The follow-up status.
          example: notFlagged
    Recipient:
      type: object
      description: Represents information about a user or contact in a message.
      properties:
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
    DateTimeTimeZone:
      type: object
      description: A date-time value with a time zone designation.
      properties:
        dateTime:
          type: string
          description: A single point of time in a combined date and time representation (e.g. 2017-08-29T04:00:00.0000000).
          example: example_value
        timeZone:
          type: string
          description: Represents a time zone, for example, Pacific Standard Time.
          example: example_value
    ODataError:
      type: object
      description: OData error response from Microsoft Graph.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: The error code.
            message:
              type: string
              description: The error message.
            innerError:
              type: object
              properties:
                request-id:
                  type: string
                date:
                  type: string
                  format: date-time
          example: example_value
    InternetMessageHeader:
      type: object
