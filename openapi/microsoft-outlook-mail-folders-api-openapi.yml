        type: string
    top:
      name: $top
      in: query
      description: Sets the page size of results.
      schema:
        type: integer
        minimum: 1
    filter:
      name: $filter
      in: query
      description: OData filter expression to filter results.
      schema:
        type: string
    mailFolderId:
      name: mailFolder-id
      in: path
      required: true
      description: The unique identifier of the mail folder, or a well-known folder name such as inbox, drafts, sentitems, deleteditems, archive, junkemail, or outbox.
      schema:
        type: string
    skip:
      name: $skip
      in: query
      description: Number of items to skip for pagination.
      schema:
        type: integer
        minimum: 0
    orderby:
      name: $orderby
      in: query
      description: Comma-separated list of properties to sort results by.
      schema:
        type: string
