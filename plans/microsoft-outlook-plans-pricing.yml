        name: mailbox
        type: quota
        metric: gb
        limit: 50
        timeFrame: usage
        geo: global
        unit: 1
        price: included
        userMultiplied: true
    elements:
      - name: Outlook desktop, web, mobile
      - name: 50 GB mailbox
      - name: Bookings
  - id: microsoft-outlook-exchange-plan-2
    name: Outlook via Exchange Online Plan 2
    type: subscription
    description: 100 GB mailbox plus 1.5 TB auto-expanding archive. $8.00/user/month, paid yearly.
    entries:
