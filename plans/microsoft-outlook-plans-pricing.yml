specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Outlook
providerId: microsoft-outlook
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Email
  - Calendar
  - Productivity
  - Outlook
  - Microsoft
description: Microsoft Outlook is delivered as a free consumer service (Outlook.com) and as a paid client
  bundled with Microsoft 365 / Office 365. Programmatic access (Microsoft Graph mail / calendar / contacts)
  is included with the seat licence. New Outlook for Windows is free with a Microsoft account; classic
  Outlook desktop requires Microsoft 365.
sources:
  - https://www.microsoft.com/en-us/microsoft-365/outlook/email-and-calendar-software-microsoft-outlook
  - https://www.microsoft.com/en-us/microsoft-365/business/compare-all-plans
  - https://www.microsoft.com/en-us/microsoft-365/exchange/compare-microsoft-exchange-online-plans
plans:
  - id: microsoft-outlook-com-free
    name: Outlook.com (Free)
    type: freemium
    description: Free consumer email at outlook.com / hotmail.com with 15 GB mailbox and 5 GB OneDrive.
      Includes ads in the inbox.
    entries:
      - label: Free with a Microsoft account
        name: outlook_com_free
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
      - label: Mailbox
        name: outlook_com_mailbox
        type: quota
        metric: gb
        limit: 15
        timeFrame: usage
        geo: global
        unit: 1
        price: included
        userMultiplied: true
    elements:
      - name: 15 GB mailbox
      - name: Outlook.com / Hotmail web access
      - name: New Outlook for Windows
      - name: Free Microsoft Graph access (personal accounts)
  - id: microsoft-outlook-business-basic
    name: Outlook via Microsoft 365 Business Basic
    type: subscription
    description: Web + mobile Outlook with a 50 GB mailbox via Exchange Online Plan 1. $6.00/user/month
      with Teams, $4.40/user/month without Teams (annual).
    entries:
      - label: Per user, paid yearly (with Teams)
        name: business_basic
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '6.00'
        userMultiplied: true
      - label: Per user, paid yearly (no Teams)
        name: business_basic_no_teams
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '4.40'
        userMultiplied: true
      - label: Mailbox
        name: mailbox
        type: quota
        metric: gb
        limit: 50
        timeFrame: usage
        geo: global
        unit: 1
        price: included
        userMultiplied: true
    elements:
      - name: Outlook web and mobile
      - name: 50 GB Exchange Online mailbox
      - name: Calendar and contacts
  - id: microsoft-outlook-business-standard
    name: Outlook via Microsoft 365 Business Standard
    type: subscription
    description: Adds Outlook desktop client. $12.50/user/month with Teams (annual).
    entries:
